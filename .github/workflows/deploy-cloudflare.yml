# Deploy to Cloudflare Workers on every push to main: build dist/ and publish it
# with Wrangler, along with worker/index.ts (the hourly Supabase keep-alive).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token with the "Workers Scripts: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — the Cloudflare account id that owns the Worker
#   VITE_SUPABASE_URL      — the public Supabase project URL
#   VITE_SUPABASE_ANON_KEY — the public anon key (safe to expose to the client)
#
# The two VITE_* values are baked into the build and also stored as Worker
# secrets (SUPABASE_URL, SUPABASE_ANON_KEY) for the keep-alive cron. No
# server-only key is needed: the cron only reads the public `matches` table.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One deploy at a time; cancel an in-flight run when a newer commit lands.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          # Pin wrangler v4 to match the devDependency; the action's bundled
          # 3.90.0 is too old for this wrangler.jsonc.
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            SUPABASE_URL
            SUPABASE_ANON_KEY
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
